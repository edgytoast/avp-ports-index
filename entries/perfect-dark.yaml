    url: https://github.com/perfect-dark-pc-port/perfect_dark
  - name: n64decomp
    role: Perfect Dark decompilation
    url: https://github.com/n64decomp/perfect_dark
  - name: ANGLE
    role: OpenGL ES on Metal
    url: https://chromium.googlesource.com/angle/angle
  - name: SDL2
    role: Windowing, input and audio
    url: https://libsdl.org
  - name: Rare / Microsoft
    role: Original game
upstream:
