description: >-
  Perfect Dark on Apple Vision Pro: the decompilation through the PC port and Dab's Mod, on Metal. A
  resizable 2D window or a stereoscopic 3D screen in your room, with optional Xbox 360 (XBLA) art
  and GoldenEye 007 (GE Plus) from your own copies. Bring your own ROM.
