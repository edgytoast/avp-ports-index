description: >-
  Banjo-Kazooie on Apple Vision Pro through a mobile and XR fork of Harbour Masters' Lighthouse,
  rendering on Metal. The game sits on a plate in a volume in the Shared Space, drawn per eye, and
  head motion shifts the projection so the world reaches behind the glass. Bring your own ROM.
