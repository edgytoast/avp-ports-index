status_notes: "Unofficial. Blizzard doesn't support playing this way, and the developer warns your account could be actioned; a game patch can break it for a while. Needs a Battle.net subscription, a hardware keyboard, LocalDevVPN and visionOS 27. Not tested by the curator."
