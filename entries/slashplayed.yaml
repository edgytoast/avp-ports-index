description: >-
  World of Warcraft in a window on Apple Vision Pro: Blizzard's official Mac client, unmodified,
  running on the headset. Classic Era, TBC Anniversary, MoP Classic and Retail. A Mac companion app
  sets it up once, then the headset plays on its own. Needs your own WoW subscription.
