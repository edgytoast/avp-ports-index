status_notes: "Unofficial: Blizzard doesn't support it, and the developer warns accounts could be actioned. Keeps your Battle.net login on the headset; optional Apple ID sign-in uses a third-party server. Needs a WoW subscription, hardware keyboard, LocalDevVPN, visionOS 27."
visionos_min: "27.0"
input: [keyboard-mouse]
