  original_platform: gamecube
  original_release_year: 2006
repo: https://github.com/stacklikemind/dusklight
developer:
  github: stacklikemind
status: working
status_notes: "The README says it builds and runs on visionOS, verified on the visionOS 26.5 Simulator and on Apple Vision Pro hardware, in a window with a 21:9 presentation."
