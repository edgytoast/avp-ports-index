  github: portal-in-the-visor
status: working
status_notes: "The author played it on one M2 headset and archived it; this copy adds an install guide. Heavier areas can drop below 60 fps, the gun's glow is missing, and menus show on a flat screen. Not tested by the curator."
visionos_min: "26.0"
