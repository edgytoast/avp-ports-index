    url: https://github.com/illixion/halflife-visionos
  - name: ANGLE
    role: OpenGL ES on Metal
    url: https://chromium.googlesource.com/angle/angle
  - name: XcodeGen
    role: Xcode project generation
    url: https://github.com/yonaskolb/XcodeGen
