schema_version: 1
id: quake3e
name: Quake3e
game:
  title: "Quake III Arena"
  original_platform: pc
  original_release_year: 1999
repo: https://github.com/rebelancap/quake3e-ios
developer:
  github: rebelancap
status: working
visionos_min: "2.0"
input: [game-controller]
experiences: [2d, 3d-immersive, 6dof-immersive]
