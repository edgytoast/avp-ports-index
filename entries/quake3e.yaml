description: >-
  Quake III Arena on Apple Vision Pro through Quake3e, its Vulkan renderer running on Metal: a
  resizable 2D window, a stereoscopic 3D screen, or head-tracked VR inside the arena, aiming with your
  gaze, a gamepad or PS VR2 Sense controllers. Online play and mods work. Bring your own game files.
