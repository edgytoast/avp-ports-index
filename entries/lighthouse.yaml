    role: Lighthouse, the port this is built on
    url: https://github.com/HarbourMasters/Lighthouse
  - name: Harbour Masters
    role: libultraship, the platform layer
    url: https://github.com/HarbourMasters/libultraship
  - name: Nintendo and Rare
    role: Original game
upstream:
  - https://github.com/HarbourMasters/Lighthouse
  - https://github.com/HarbourMasters/libultraship
