  - name: Vanilla Conquer
    role: The portable engine foundation this fork uses
    url: https://github.com/TheAssemblyArmada/Vanilla-Conquer
  - name: SDL
    role: Platform, rendering and input foundation
    url: https://github.com/libsdl-org/SDL
  - name: unshieldv3
    role: InstallShield archive extraction for the importer
upstream:
