schema_version: 1
id: half-life-alyx
name: Glovebox
game:
  title: "Half-Life: Alyx"
  original_platform: pc
  original_release_year: 2020
repo: https://github.com/edgytoast/glovebox
developer:
  github: glovebox-vr
status: working
status_notes: "Runs on the headset itself; the curator installed it from scratch with this copy's guide (Steam save, controllers, frame rate fine). Known issues: close objects can look doubled as you move (45 fps shown twice), busy scenes can slow down, no left-handed or one-controller play."
visionos_min: "26.0"
input: [game-controller]
experiences: [6dof-immersive]
install: [build, sideload]
description: >-
  Half-Life: Alyx on Apple Vision Pro itself, with no PC or streaming: Klepton converts the game's
  ARM64 Linux build into signed visionOS code on your Mac. Install it with the Glovebox Mac app or
  build it from source, with your own Steam copy. Listed from a copy that adds only the install guide.
tags: [half-life, half-life-alyx, vr, 6dof, first-person, source-2, klepton, steam]
