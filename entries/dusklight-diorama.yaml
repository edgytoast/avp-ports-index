  - name: zeldaret
    role: Twilight Princess decompilation
    url: https://github.com/zeldaret/tp
  - name: Aurora
    role: GameCube and Wii graphics layer
    url: https://github.com/encounter/aurora
  - name: Nintendo
    role: Original game
upstream:
  - https://github.com/TwilitRealm/dusklight
