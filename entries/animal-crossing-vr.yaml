  - {name: flyngmt, role: "ACGC-PC-Port, the native PC port", url: "https://github.com/flyngmt/ACGC-PC-Port"}
  - {name: zwaetschge, role: "ACGC-Android-Port, the 64-bit base", url: "https://github.com/zwaetschge/ACGC-Android-Port"}
  - {name: iChris4, role: "WiiCompiled Vision, source of the visionOS OpenXR provider", url: "https://github.com/iChris4/Wiicompiled_VR"}
upstream:
