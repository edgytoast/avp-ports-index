# entries/<id>.yaml for the AVP Ports Index. The field reference is references/entry-fields.md.
# Required: id, name, game.title, repo, developer.github, status, experiences. Delete optional lines you don't need.
schema_version: 1
id: my-port                         # lowercase slug; must equal the file name (my-port.yaml)
name: "My Port"
game:
  title: "Original Game Title"
  original_platform: gamecube        # gamecube, wii, n64, ps1, ps2, xbox, dreamcast, pc or other
  original_release_year: 2001
repo: https://github.com/you/my-port # no .git, no trailing slash
# source_ref: my-branch             # only if the port isn't on the repo's default branch
developer:
  github: you
  name: "Your Name"
  url: https://example.com
status: working                      # developer-verified, working, partially-working or not-working
status_notes: "Playable start to finish with a controller."
visionos_min: "26.0"                 # keep the quotes
input: [game-controller]             # game-controller, hand-tracking, keyboard-mouse
experiences: [6dof-immersive]        # every mode it has: 2d, 3d-immersive, 3d-shared-space, 6dof-immersive, 6dof-progressive
# install: [build, sideload]         # only if you also publish a prebuilt app
description: "One or two sentences about the port."
tags: [platformer]
credits:
  - name: "Upstream decompilation project"
    role: "Decompilation"
    url: https://github.com/upstream/project
upstream:
  - https://github.com/upstream/project
